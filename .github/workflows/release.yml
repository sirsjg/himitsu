name: Container release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# This repository builds and attests artifacts. It does not deploy, and it holds no
# deploy credentials of any kind: there are no cloud secrets, no environments, and no
# federated identity pointing at any infrastructure. Promotion is the private deploy
# repository's job, which pins these images by digest.
#
# Never triggered by pull_request. Third-party actions are pinned by commit SHA
# rather than tag, because a tag is mutable and this workflow signs what it builds.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.stamp.outputs.version }}
      image_tag: ${{ steps.stamp.outputs.image_tag }}
      commit: ${{ steps.stamp.outputs.commit }}
    steps:
      - name: Derive the build stamp
        id: stamp
        run: |
          set -euo pipefail
          commit="${GITHUB_SHA:0:7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            # docker/metadata-action emits semver image tags without the leading "v".
            image_tag="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev+${commit}"
            image_tag="sha-${commit}"
          fi
          {
            echo "version=${version}"
            echo "image_tag=${image_tag}"
            echo "commit=${commit}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${version} (${commit}) -> image tag ${image_tag}"

  publish:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # id-token feeds Sigstore's keyless flow and the provenance attestation. It is
      # scoped to this job and grants nothing outside GitHub's OIDC trust root.
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [api, web, ops]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          # Stamps the release into the web bundle's footer and the API's /health/live,
          # so a running container can be traced back to the tag that built it.
          build-args: |
            HIMITSU_VERSION=${{ needs.version.outputs.version }}
            HIMITSU_COMMIT=${{ needs.version.outputs.commit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Sign the image with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # Keyless: the signing identity is this workflow's OIDC identity, recorded in
          # the public transparency log. There is no private key to hold or rotate.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST}"

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Job outputs are shared across matrix legs and overwrite each other, so the
      # digests travel to the pin job as artifacts instead.
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s' "${DIGEST}" > "digests/${{ matrix.target }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target }}
          path: digests/${{ matrix.target }}
          retention-days: 7

  # Emits the exact digests to pin, so promoting a release is a copy of verified
  # values into the deploy repository rather than a re-resolution of a mutable tag.
  pin:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Print the digest pin block
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          API=$(cat digests/api)
          WEB=$(cat digests/web)
          OPS=$(cat digests/ops)
          {
            echo "### Digest pins for \`${VERSION}\`"
            echo
            echo "Copy into \`images.json\` in the deploy repository:"
            echo
            echo '```json'
            printf '{\n'
            printf '  "version": "%s",\n' "${VERSION}"
            printf '  "registry": "%s",\n' "${REPO}"
            printf '  "images": {\n'
            printf '    "api": "%s",\n' "${API}"
            printf '    "web": "%s",\n' "${WEB}"
            printf '    "ops": "%s"\n' "${OPS}"
            printf '  }\n'
            printf '}\n'
            echo '```'
            echo
            echo "Verify before pinning:"
            echo
            echo '```sh'
            echo "cosign verify ${REPO}-api@${API} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
