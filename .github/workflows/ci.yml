name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build first. Every workspace package resolves its siblings through
      # "exports".types -> dist/src/index.d.ts, so typecheck and test both fail
      # with "Cannot find module '@himitsu/…'" on a clean checkout until the
      # dependency-ordered build in scripts/build-all.sh has produced them.
      # This passes locally only because dist/ already exists there.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # Checks documentation structure and links, and fails when the committed
      # docs/openapi.json has drifted from the routes the API actually serves.
      # Without this the published contract silently goes stale — it had lost
      # every auth and session route before this job was added.
      - run: npm run docs:check

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: himitsu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d himitsu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/himitsu_test
      TEST_APP_DATABASE_URL: postgresql://himitsu_app:himitsu_app_test@127.0.0.1:5432/himitsu_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same reason as unit-build: each package's test:postgres runs its own
      # build, which cannot compile until its dependencies have been built.
      - run: npm run build
      - run: npm run test:postgres

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --target api --tag himitsu-api:test .
      - run: docker build --target web --tag himitsu-web:test .
      - run: docker build --target ops --tag himitsu-ops:test .

  integrations-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [client, operator, terraform-provider]
    defaults:
      run:
        working-directory: integrations/${{ matrix.module }}
    env:
      # Build each module standalone via its own replace directive, so a broken
      # module cannot be masked by the go.work workspace.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: integrations/${{ matrix.module }}/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'Run gofmt -w .'; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  integrations-operator-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: integrations/operator/go.sum
      - run: go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0
      - name: Regenerate CRDs, RBAC, and deepcopy
        working-directory: integrations/operator
        env:
          GOWORK: "off"
        run: |
          controller-gen object paths=./api/...
          controller-gen crd rbac:roleName=himitsu-operator paths=./... \
            output:crd:artifacts:config=config/crd \
            output:rbac:artifacts:config=config/rbac
      - name: Fail if generated files are stale
        run: git diff --exit-code -- integrations/operator || {
          echo 'Generated operator manifests are out of date. Re-run controller-gen and commit.'; exit 1; }

  integrations-github-action:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/github-action
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The action is not an npm workspace member, but its tsconfig extends the
      # repository base config and needs @types/node from the root install.
      - name: Install root dev dependencies
        working-directory: .
        run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail if committed dist is stale
        # GitHub runs the action from dist/, so a stale build ships old code.
        run: git diff --exit-code -- dist || {
          echo 'integrations/github-action/dist is out of date. Run npm run build and commit.'; exit 1; }
