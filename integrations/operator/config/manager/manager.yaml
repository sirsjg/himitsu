apiVersion: v1
kind: Namespace
metadata:
  name: himitsu-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: himitsu-operator
  namespace: himitsu-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: himitsu-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: himitsu-operator
subjects:
  - kind: ServiceAccount
    name: himitsu-operator
    namespace: himitsu-system
---
# Leader election needs coordination.k8s.io leases in the operator's own
# namespace. Kept as a Role so the ClusterRole stays limited to what the
# reconciler actually touches.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: himitsu-operator-leader-election
  namespace: himitsu-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: himitsu-operator-leader-election
  namespace: himitsu-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: himitsu-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: himitsu-operator
    namespace: himitsu-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: himitsu-operator
  namespace: himitsu-system
  labels:
    app.kubernetes.io/name: himitsu-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: himitsu-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: himitsu-operator
    spec:
      serviceAccountName: himitsu-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/sirsjg/himitsu-operator:latest
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      terminationGracePeriodSeconds: 10
