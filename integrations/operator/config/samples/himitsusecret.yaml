# The token Secret. Use a read-only, environment-scoped Himitsu API key: the
# operator only ever reads.
apiVersion: v1
kind: Secret
metadata:
  name: himitsu-token
  namespace: apps
type: Opaque
stringData:
  token: himi_0123456789abcdef_replace_with_a_real_token_value_here
---
# Default form: one Kubernetes Secret key per Himitsu secret, ready for envFrom.
apiVersion: himitsu.io/v1alpha1
kind: HimitsuSecret
metadata:
  name: app-config
  namespace: apps
spec:
  apiUrl: https://himitsu.example.com
  projectId: 11111111-1111-1111-1111-111111111111
  environmentId: 22222222-2222-2222-2222-222222222222
  authSecretRef:
    name: himitsu-token
    key: token
  refreshInterval: 1m
  target:
    name: app-secrets
---
# Dotenv form: everything in one file, for apps that load .env at boot.
apiVersion: himitsu.io/v1alpha1
kind: HimitsuSecret
metadata:
  name: legacy-app-config
  namespace: apps
spec:
  apiUrl: https://himitsu.example.com
  projectId: 11111111-1111-1111-1111-111111111111
  environmentId: 22222222-2222-2222-2222-222222222222
  authSecretRef:
    name: himitsu-token
  target:
    name: legacy-app-env
    creationPolicy: Merge
    template:
      format: Dotenv
      key: .env
      annotations:
        # Restart consumers when the rendered file changes.
        reloader.stakater.com/match: "true"
---
# Consuming the default KeyValue target.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/example/api:latest
          envFrom:
            - secretRef:
                name: app-secrets
